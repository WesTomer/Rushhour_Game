<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rush Hour Puzzle Game - Expert Edition</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #38bdf8;
            --grid-bg: #1f2937;
            --grid-line: #374151;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7), 0 8px 10px -6px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #1f2937;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            color: #f3f4f6;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .objective {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .objective span.red-text {
            color: #ef4444;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        select, button {
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #374151;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select {
            background-color: #0b0f19;
            color: var(--text-color);
            flex: 1;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: #dc2626;
            color: white;
            font-weight: 600;
            border: none;
            box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.4);
        }

        button:hover {
            background-color: #b91c1c;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .gen-status {
            font-size: 0.85rem;
            color: var(--accent-color);
            height: 20px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .game-wrapper {
            position: relative;
            padding: 12px;
            background-color: #0b0f19;
            border-radius: 16px;
            border: 4px solid #374151;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .board-container {
            position: relative;
            width: 360px;
            height: 360px;
            background-color: var(--grid-bg);
            border-radius: 8px;
            overflow: visible;
        }

        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            border-radius: 8px;
            overflow: hidden;
        }

        .grid-cell {
            border: 1px solid var(--grid-line);
            box-sizing: border-box;
        }

        .exit-marker {
            position: absolute;
            right: -28px;
            top: 120px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            font-size: 24px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        .vehicle {
            position: absolute;
            border-radius: 8px;
            box-sizing: border-box;
            cursor: pointer;
            transition: top 0.15s ease-out, left 0.15s ease-out, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.3), 0 4px 6px rgba(0,0,0,0.4);
            border: 2px solid rgba(0,0,0,0.2);
            z-index: 10;
        }

        .vehicle:hover {
            filter: brightness(1.15);
        }

        .vehicle.selected {
            outline: 3px solid #ffffff;
            z-index: 20;
        }

        .vehicle.target {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: #991b1b;
        }

        .status-bar {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .win-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .win-overlay h2 {
            font-size: 2.2rem;
            color: #4ade80;
            margin-bottom: 10px;
        }

        .win-overlay p {
            margin-bottom: 20px;
            color: #cbd5e1;
        }

        .win-overlay button {
            background-color: #22c55e;
        }

        .win-overlay button:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RUSH HOUR</h1>
        <p class="objective">Slide vehicles along their axis to free the <span class="red-text">Red Car</span> through the exit on the right!</p>
    </header>

    <div class="controls">
        <select id="difficulty">
            <option value="hard">Hard (12 - 20 moves)</option>
            <option value="expert" selected>Expert (21 - 35 moves)</option>
            <option value="grandmaster">Grandmaster (36+ moves)</option>
        </select>
        <button id="generateBtn">Generate New</button>
    </div>

    <div class="gen-status" id="genStatus"></div>

    <div class="game-wrapper">
        <div class="board-container" id="board">
            <div class="grid-background">
                <script>
                    for(let i=0; i<36; i++) {
                        document.write('<div class="grid-cell"></div>');
                    }
                </script>
            </div>
            <div class="exit-marker" title="Exit Slot">➔</div>
        </div>

        <div class="win-overlay" id="winOverlay">
            <h2>Masterfully Solved!</h2>
            <p id="winStats">You escaped in 0 moves!</p>
            <button id="playAgainBtn">Next Challenge</button>
        </div>
    </div>

    <div class="status-bar">
        <div>Moves: <span id="moveCount" style="color: var(--text-color); font-weight: bold;">0</span></div>
        <div>Optimal Solution: <span id="minMoves" style="color: var(--accent-color); font-weight: bold;">-</span></div>
    </div>
</div>

<script>
    const CELL_SIZE = 60;

    const VEHICLE_COLORS = [
        '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6',
        '#ec4899', '#06b6d4', '#84cc16', '#a855f7',
        '#eab308', '#64748b', '#f97316', '#14b8a6'
    ];

    let currentVehicles = [];
    let moveCount = 0;
    let minMovesTarget = 0;

    const boardEl = document.getElementById('board');
    const moveCountEl = document.getElementById('moveCount');
    const minMovesEl = document.getElementById('minMoves');
    const difficultySelect = document.getElementById('difficulty');
    const generateBtn = document.getElementById('generateBtn');
    const genStatus = document.getElementById('genStatus');
    const winOverlay = document.getElementById('winOverlay');
    const winStats = document.getElementById('winStats');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // --- ENCODING & UTILS ---

    function encodeState(vehicles) {
        return vehicles.map(v => `${v.x},${v.y}`).join('|');
    }

    function isSolved(vehicles) {
        return vehicles[0].x === 4;
    }

    function getBoardGrid(vehicles) {
        const grid = Array(6).fill(null).map(() => Array(6).fill(-1));
        vehicles.forEach((v, idx) => {
            for (let i = 0; i < v.length; i++) {
                const rx = v.orientation === 'H' ? v.x + i : v.x;
                const ry = v.orientation === 'V' ? v.y + i : v.y;
                if (rx >= 0 && rx < 6 && ry >= 0 && ry < 6) {
                    grid[ry][rx] = idx;
                }
            }
        });
        return grid;
    }

    // --- BFS SOLVER WITH PARALLEL MOVE AGGREGATION ---
    function getValidMoves(vehicles) {
        const neighbors = [];
        const grid = getBoardGrid(vehicles);

        vehicles.forEach((v, idx) => {
            if (v.orientation === 'H') {
                // Move Left (any distance)
                for (let dist = 1; v.x - dist >= 0; dist++) {
                    if (grid[v.y][v.x - dist] !== -1) break;
                    const nextV = vehicles.map(item => ({...item}));
                    nextV[idx].x -= dist;
                    neighbors.push(nextV);
                }
                // Move Right (any distance)
                for (let dist = 1; v.x + v.length - 1 + dist < 6; dist++) {
                    if (grid[v.y][v.x + v.length - 1 + dist] !== -1) break;
                    const nextV = vehicles.map(item => ({...item}));
                    nextV[idx].x += dist;
                    neighbors.push(nextV);
                }
            } else {
                // Move Up (any distance)
                for (let dist = 1; v.y - dist >= 0; dist++) {
                    if (grid[v.y - dist][v.x] !== -1) break;
                    const nextV = vehicles.map(item => ({...item}));
                    nextV[idx].y -= dist;
                    neighbors.push(nextV);
                }
                // Move Down (any distance)
                for (let dist = 1; v.y + v.length - 1 + dist < 6; dist++) {
                    if (grid[v.y + v.length - 1 + dist][v.x] !== -1) break;
                    const nextV = vehicles.map(item => ({...item}));
                    nextV[idx].y += dist;
                    neighbors.push(nextV);
                }
            }
        });

        return neighbors;
    }

    function solvePuzzle(initialVehicles) {
        if (isSolved(initialVehicles)) return 0;

        const queue = [{ state: initialVehicles, dist: 0 }];
        const visited = new Set();
        visited.add(encodeState(initialVehicles));

        while (queue.length > 0) {
            const { state, dist } = queue.shift();

            if (dist > 60) return -1;

            const neighbors = getValidMoves(state);
            for (let nextState of neighbors) {
                if (isSolved(nextState)) {
                    return dist + 1;
                }
                const key = encodeState(nextState);
                if (!visited.has(key)) {
                    visited.add(key);
                    queue.push({ state: nextState, dist: dist + 1 });
                }
            }
        }

        return -1;
    }

    // High density board generator for complex blockades
    function generatePuzzle() {
        genStatus.innerText = "Generating high-complexity puzzle...";
        
        setTimeout(() => {
            const diff = difficultySelect.value;
            let minRange = 12, maxRange = 20;
            if (diff === 'expert') { minRange = 21; maxRange = 35; }
            if (diff === 'grandmaster') { minRange = 36; maxRange = 60; }

            let attempts = 0;
            while (attempts < 2000) {
                attempts++;
                const numObstacles = Math.floor(Math.random() * 4) + 9; // High density (9 to 12 vehicles)
                const vehicles = [];

                // Red Target Car
                const redX = Math.floor(Math.random() * 3);
                vehicles.push({ id: 0, x: redX, y: 2, length: 2, orientation: 'H', isTarget: true, color: '#ef4444' });

                let colorIdx = 0;
                for (let i = 0; i < numObstacles; i++) {
                    const isTruck = Math.random() < 0.35;
                    const length = isTruck ? 3 : 2;
                    const orientation = Math.random() < 0.5 ? 'H' : 'V';
                    
                    for (let tryPlace = 0; tryPlace < 15; tryPlace++) {
                        const maxX = orientation === 'H' ? 6 - length : 5;
                        const maxY = orientation === 'V' ? 6 - length : 5;
                        const rx = Math.floor(Math.random() * (maxX + 1));
                        const ry = Math.floor(Math.random() * (maxY + 1));

                        let overlap = false;
                        const grid = getBoardGrid(vehicles);
                        for (let l = 0; l < length; l++) {
                            const checkX = orientation === 'H' ? rx + l : rx;
                            const checkY = orientation === 'V' ? ry + l : ry;
                            if (grid[checkY][checkX] !== -1) {
                                overlap = true;
                                break;
                            }
                        }

                        if (!overlap) {
                            vehicles.push({
                                id: vehicles.length,
                                x: rx,
                                y: ry,
                                length: length,
                                orientation: orientation,
                                isTarget: false,
                                color: VEHICLE_COLORS[colorIdx % VEHICLE_COLORS.length]
                            });
                            colorIdx++;
                            break;
                        }
                    }
                }

                const minMoves = solvePuzzle(vehicles);
                if (minMoves >= minRange && minMoves <= maxRange) {
                    currentVehicles = vehicles;
                    minMovesTarget = minMoves;
                    moveCount = 0;
                    genStatus.innerText = "";
                    renderBoard();
                    return;
                }
            }

            // High-difficulty fallback preset if random generation takes too long
            genStatus.innerText = "";
            currentVehicles = [
                { id: 0, x: 0, y: 2, length: 2, orientation: 'H', isTarget: true, color: '#ef4444' },
                { id: 1, x: 2, y: 0, length: 3, orientation: 'V', isTarget: false, color: '#3b82f6' },
                { id: 2, x: 3, y: 0, length: 2, orientation: 'H', isTarget: false, color: '#10b981' },
                { id: 3, x: 5, y: 0, length: 3, orientation: 'V', isTarget: false, color: '#f59e0b' },
                { id: 4, x: 3, y: 1, length: 2, orientation: 'V', isTarget: false, color: '#8b5cf6' },
                { id: 5, x: 4, y: 2, length: 2, orientation: 'V', isTarget: false, color: '#ec4899' },
                { id: 6, x: 0, y: 3, length: 3, orientation: 'V', isTarget: false, color: '#06b6d4' },
                { id: 7, x: 1, y: 3, length: 2, orientation: 'H', isTarget: false, color: '#84cc16' },
                { id: 8, x: 1, y: 4, length: 2, orientation: 'V', isTarget: false, color: '#a855f7' },
                { id: 9, x: 2, y: 5, length: 3, orientation: 'H', isTarget: false, color: '#eab308' }
            ];
            minMovesTarget = solvePuzzle(currentVehicles);
            moveCount = 0;
            renderBoard();
        }, 50);
    }

    function renderBoard() {
        const existingVehicles = boardEl.querySelectorAll('.vehicle');
        existingVehicles.forEach(el => el.remove());

        moveCountEl.innerText = moveCount;
        minMovesEl.innerText = `${minMovesTarget} moves`;

        currentVehicles.forEach(v => {
            const vEl = document.createElement('div');
            vEl.className = `vehicle ${v.isTarget ? 'target' : ''}`;
            vEl.id = `vehicle-${v.id}`;
            vEl.style.backgroundColor = v.color;

            const width = v.orientation === 'H' ? v.length * CELL_SIZE - 4 : CELL_SIZE - 4;
            const height = v.orientation === 'V' ? v.length * CELL_SIZE - 4 : CELL_SIZE - 4;

            vEl.style.width = `${width}px`;
            vEl.style.height = `${height}px`;
            vEl.style.left = `${v.x * CELL_SIZE + 2}px`;
            vEl.style.top = `${v.y * CELL_SIZE + 2}px`;

            if (v.isTarget) {
                vEl.innerHTML = '★ ESCAPE ★';
            }

            attachDragAndClickEvents(vEl, v);
            boardEl.appendChild(vEl);
        });

        winOverlay.classList.remove('active');
    }


    function attachDragAndClickEvents(el, vehicle) {
        let startX, startY, origX, origY;
        let isDragging = false;

        const onPointerDown = (e) => {
            e.preventDefault();
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            origX = vehicle.x;
            origY = vehicle.y;

            document.querySelectorAll('.vehicle').forEach(v => v.classList.remove('selected'));
            el.classList.add('selected');

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
        };

        const onPointerMove = (e) => {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            const grid = getBoardGrid(currentVehicles);

            if (vehicle.orientation === 'H') {
                const cellDelta = Math.round(deltaX / CELL_SIZE);
                let targetX = origX + cellDelta;

                targetX = Math.max(0, Math.min(6 - vehicle.length, targetX));
                
                let validX = origX;
                const step = targetX > origX ? 1 : -1;
                for (let x = origX + step; step > 0 ? x <= targetX : x >= targetX; x += step) {
                    const leadingEdge = step > 0 ? x + vehicle.length - 1 : x;
                    if (grid[vehicle.y][leadingEdge] !== -1 && grid[vehicle.y][leadingEdge] !== vehicle.id) {
                        break;
                    }
                    validX = x;
                }

                if (validX !== vehicle.x) {
                    vehicle.x = validX;
                    el.style.left = `${vehicle.x * CELL_SIZE + 2}px`;
                }

            } else {
                const cellDelta = Math.round(deltaY / CELL_SIZE);
                let targetY = origY + cellDelta;

                targetY = Math.max(0, Math.min(6 - vehicle.length, targetY));

                let validY = origY;
                const step = targetY > origY ? 1 : -1;
                for (let y = origY + step; step > 0 ? y <= targetY : y >= targetY; y += step) {
                    const leadingEdge = step > 0 ? y + vehicle.length - 1 : y;
                    if (grid[leadingEdge][vehicle.x] !== -1 && grid[leadingEdge][vehicle.x] !== vehicle.id) {
                        break;
                    }
                    validY = y;
                }

                if (validY !== vehicle.y) {
                    vehicle.y = validY;
                    el.style.top = `${vehicle.y * CELL_SIZE + 2}px`;
                }
            }
        };

        const onPointerUp = () => {
            if (!isDragging) return;
            isDragging = false;
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);

            if (vehicle.x !== origX || vehicle.y !== origY) {
                moveCount++;
                moveCountEl.innerText = moveCount;
                checkWinCondition();
            }
        };

        el.addEventListener('pointerdown', onPointerDown);
    }

    function checkWinCondition() {
        const target = currentVehicles[0];
        if (target.x === 4) {
            setTimeout(() => {
                const targetEl = document.getElementById('vehicle-0');
                targetEl.style.left = `${6 * CELL_SIZE + 2}px`;
                
                setTimeout(() => {
                    winStats.innerText = `You completed the puzzle in ${moveCount} moves! (Optimal Par: ${minMovesTarget})`;
                    winOverlay.classList.add('active');
                }, 300);
            }, 100);
        }
    }

    generateBtn.addEventListener('click', generatePuzzle);
    playAgainBtn.addEventListener('click', generatePuzzle);

    generatePuzzle();
</script>

</body>
</html>
