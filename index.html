<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rush Hour Puzzle Game</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #38bdf8;
            --grid-bg: #1f2937;
            --grid-line: #374151;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --border-radius: 12px;
            --cell: 50px;      /* set from JS to fit the screen */
            --ui-scale: 1;     /* grows text and controls on larger screens */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-size: calc(16px * var(--ui-scale));
        }

        .container {
            background-color: var(--card-bg);
            padding: calc(20px * var(--ui-scale));
            border-radius: var(--border-radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: calc(var(--cell) * 6 + 40px + 40px * var(--ui-scale));
            width: 100%;
            border: 1px solid #1f2937;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.75em;
            color: #f3f4f6;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .objective {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .objective span.red-text {
            color: #ef4444;
            font-weight: bold;
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: clamp(6px, 1.5vw, 10px);
            width: 100%;
            max-width: 100%;
            margin-bottom: 15px;
            align-items: stretch;
        }

        select, button {
            min-width: 0;
            max-width: 100%;
            padding: 0.65em clamp(0.55em, 1.5vw, 0.8em);
            font-size: 0.9em;
            border-radius: 8px;
            border: 1px solid #374151;
            outline: none;
            cursor: pointer;
        }

        select {
            background-color: #0b0f19;
            color: var(--text-color);
            width: 100%;
            min-width: 0;
        }

        button {
            background-color: #dc2626;
            color: white;
            font-weight: 600;
            border: none;
            white-space: nowrap;
            width: auto;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        #resetBtn {
            background-color: #2d8bcf;
        }
        #resetBtn:not(:disabled):hover {
            background-color: #1d4ed8;
        }
        @media (max-width: 430px) {
            .controls { gap: 6px; }
            select, button {
                font-size: 0.82em;
                padding-left: 0.55em;
                padding-right: 0.55em;
            }
        }
        .gen-status {
            font-size: 0.85em;
            color: var(--accent-color);
            min-height: 1.4em; text-align: center;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .game-wrapper {
            position: relative;
            padding: 8px;
            background-color: #0b0f19;
            border-radius: 16px;
            border: 4px solid #374151;
            touch-action: none;
        }

        .board-container {
            position: relative;
            width: calc(var(--cell) * 6);
            height: calc(var(--cell) * 6);
            background-color: var(--grid-bg);
            border-radius: 8px;
            touch-action: none;
        }

        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            border-radius: 8px;
            overflow: hidden;
        }

        .grid-cell {
            border: 1px solid var(--grid-line);
        }

        .exit-marker {
            position: absolute;
            right: calc(var(--cell) * -0.48);
            top: calc(var(--cell) * 2);
            height: var(--cell);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            font-size: calc(var(--cell) * 0.4);
            font-weight: bold;
        }

        .vehicle {
            position: absolute;
            border-radius: 8px;
            box-sizing: border-box;
            cursor: pointer;
            transition: top 0.1s ease-out, left 0.1s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: calc(var(--cell) * 0.24);
            color: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.3), 0 4px 6px rgba(0,0,0,0.4);
            border: 2px solid rgba(0,0,0,0.2);
            z-index: 10;
            touch-action: none;
        }

        .vehicle.selected {
            outline: 3px solid #ffffff;
            z-index: 20;
        }

        .vehicle.target {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: #991b1b;
        }

        .status-bar {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .win-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .win-overlay h2 {
            font-size: 1.8em;
            color: #4ade80;
            margin-bottom: 10px;
        }

        .win-overlay p {
            margin-bottom: 20px;
            color: #cbd5e1;
            text-align: center;
            padding: 0 10px;
        }

        .win-overlay button {
            background-color: #22c55e;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RUSH HOUR</h1>
        <p class="objective">Slide vehicles along their axis to free the <span class="red-text">Red Car</span> through the exit!</p>
    </header>

    <div class="controls">
        <select id="difficulty">
            <option value="easy">Easy (2 - 5 moves)</option>
            <option value="regular" selected>Regular (6 - 11 moves)</option>
            <option value="hard">Hard (12 - 20 moves)</option>
            <option value="expert">Expert (21 - 35 moves)</option>
            <option value="grandmaster">Grandmaster (36+ moves)</option>
        </select>
        <button id="resetBtn" disabled>Reset</button>
        <button id="generateBtn">New</button>
    </div>

    <div class="gen-status" id="genStatus"></div>

    <div class="game-wrapper">
        <div class="board-container" id="board">
            <div class="grid-background" id="gridBg"></div>
            <div class="exit-marker">➔</div>
        </div>

        <div class="win-overlay" id="winOverlay">
            <h2>Solved!</h2>
            <p id="winStats">You escaped in 0 moves!</p>
            <button id="playAgainBtn">Next Challenge</button>
        </div>
    </div>

    <div class="status-bar">
        <div>Moves: <span id="moveCount" style="color: var(--text-color); font-weight: bold;">0</span></div>
        <div>Minimum: <span id="minMoves" style="color: var(--accent-color); font-weight: bold;">-</span></div>
    </div>
</div>

<script id="rh-engine">
// ===================== RUSH HOUR ENGINE (shared by main thread + worker) =====================
// Model: vehicle = { o:'H'|'V', len:2|3, fixed:row(H)/col(V) }, position = offset along its axis (0..4).
// A board state is the array of positions, packed into one number (base 5) for fast hashing.
var RH = (function () {
    var P5 = []; for (var i = 0, p = 1; i < 16; i++, p *= 5) P5.push(p);
    var EXIT_ROW = 2, MAX_VEH = 14;

    function encode(pos) { var k = 0; for (var i = pos.length - 1; i >= 0; i--) k = k * 5 + pos[i]; return k; }
    function decode(n, k) { var p = []; for (var i = 0; i < n; i++) { var r = k % 5; p.push(r); k = (k - r) / 5; } return p; }
    function cells(v, p) { var c = []; for (var i = 0; i < v.len; i++) c.push(v.o === 'H' ? v.fixed * 6 + p + i : (p + i) * 6 + v.fixed); return c; }
    function occupancy(veh, pos) { var g = new Int8Array(36).fill(-1); for (var i = 0; i < veh.length; i++) cells(veh[i], pos[i]).forEach(function (c) { g[c] = i; }); return g; }

    // Open-addressing hash table: packed state key -> cluster index
    function KeyTable(cap) { var s = 1; while (s < cap * 2) s <<= 1; this.mask = s - 1; this.k = new Float64Array(s).fill(-1); this.v = new Int32Array(s); }
    KeyTable.prototype.h = function (k) { var lo = k >>> 0, hi = (k / 4294967296) >>> 0; return (Math.imul(lo ^ Math.imul(hi, 0x9E3779B1), 0x85EBCA6B) ^ (lo >>> 15)) & this.mask; };
    KeyTable.prototype.get = function (k) { var i = this.h(k), K = this.k; while (K[i] !== -1) { if (K[i] === k) return this.v[i]; i = (i + 1) & this.mask; } return -1; };
    KeyTable.prototype.add = function (k, v) { var i = this.h(k), K = this.k; while (K[i] !== -1) { if (K[i] === k) return false; i = (i + 1) & this.mask; } K[i] = k; this.v[i] = v; return true; };

    // Enumerate the full cluster of states reachable from startPos, then run a RETROGRADE
    // multi-source BFS outward from every solved state (red car at x=4). Result: the exact
    // minimum number of moves for every state in the cluster, with no guessing.
    function analyzeCluster(veh, startPos, cap) {
        cap = cap || 40000;
        var n = veh.length, o = [], len = [], fx = [];
        for (var i = 0; i < n; i++) { o.push(veh[i].o === 'H' ? 0 : 1); len.push(veh[i].len); fx.push(veh[i].fixed); }
        var g = new Uint8Array(36), pos = new Int8Array(n), nb = new Float64Array(80);
        var keys = new Float64Array(cap), tbl = new KeyTable(cap);
        var start = encode(startPos); keys[0] = start; tbl.add(start, 0); var cnt = 1;
        function gen(k) {
            var t = k, i, j, q, c = 0;
            for (i = 0; i < n; i++) { var r = t % 5; pos[i] = r; t = (t - r) / 5; }
            g.fill(0);
            for (i = 0; i < n; i++) { if (o[i] === 0) { var b = fx[i] * 6 + pos[i]; for (j = 0; j < len[i]; j++) g[b + j] = 1; } else for (j = 0; j < len[i]; j++) g[(pos[i] + j) * 6 + fx[i]] = 1; }
            for (i = 0; i < n; i++) {
                var p = pos[i], L = len[i], f = fx[i], w = P5[i];
                if (o[i] === 0) { var row = f * 6;
                    for (q = p - 1; q >= 0 && !g[row + q]; q--) nb[c++] = k + (q - p) * w;
                    for (q = p + 1; q + L <= 6 && !g[row + q + L - 1]; q++) nb[c++] = k + (q - p) * w;
                } else {
                    for (q = p - 1; q >= 0 && !g[q * 6 + f]; q--) nb[c++] = k + (q - p) * w;
                    for (q = p + 1; q + L <= 6 && !g[(q + L - 1) * 6 + f]; q++) nb[c++] = k + (q - p) * w;
                }
            }
            return c;
        }
        for (var h = 0; h < cnt; h++) { var c = gen(keys[h]); for (var j = 0; j < c; j++) if (tbl.add(nb[j], cnt)) { if (cnt >= cap) return null; keys[cnt++] = nb[j]; } }
        var dist = new Int16Array(cnt).fill(-1), queue = new Int32Array(cnt), qt = 0, max = 0;
        for (i = 0; i < cnt; i++) if (keys[i] % 5 === 4) { dist[i] = 0; queue[qt++] = i; }
        if (!qt) return null;
        for (h = 0; h < qt; h++) {
            var idx = queue[h], d = dist[idx] + 1; c = gen(keys[idx]);
            for (j = 0; j < c; j++) { var x = tbl.get(nb[j]); if (dist[x] < 0) { dist[x] = d; if (d > max) max = d; queue[qt++] = x; } }
        }
        return { keys: keys.subarray(0, cnt), dist: dist, max: max, size: cnt };
    }

    // ---- Layout edits: physically shift / add / remove cars on a real board state ----
    function rint(n) { return Math.floor(Math.random() * n); }
    function tryAdd(veh, pos) {
        var g = occupancy(veh, pos);
        for (var t = 0; t < 60; t++) {
            var len = Math.random() < 0.3 ? 3 : 2, o = Math.random() < 0.5 ? 'H' : 'V', fixed = rint(6), p = rint(7 - len);
            if (o === 'H' && fixed === EXIT_ROW) continue; // a horizontal car in the exit row could never clear it
            var v = { o: o, len: len, fixed: fixed };
            if (cells(v, p).every(function (c) { return g[c] === -1; })) return { veh: veh.concat([v]), pos: pos.concat([p]) };
        }
        return null;
    }
    function removeOne(veh, pos) { var i = 1 + rint(veh.length - 1); veh = veh.slice(); pos = pos.slice(); veh.splice(i, 1); pos.splice(i, 1); return { veh: veh, pos: pos }; }
    function mutate(veh, pos) {
        var r = Math.random(), L = { veh: veh, pos: pos };
        if (veh.length >= MAX_VEH || (r < 0.30 && veh.length > 5)) return removeOne(veh, pos);       // remove a car
        if (r < 0.60 && veh.length > 5) L = removeOne(veh, pos);                                   // relocate a car
        return tryAdd(L.veh, L.pos) || L;                                                          // add a car
    }
    function randomLayout() {
        var L = { veh: [{ o: 'H', len: 2, fixed: EXIT_ROW }], pos: [rint(5)] }, target = 9 + rint(4);
        for (var t = 0; t < 200 && L.veh.length < target; t++) L = tryAdd(L.veh, L.pos) || L;
        return L;
    }
    function deepestIndex(c) { var best = [], i; for (i = 0; i < c.size; i++) if (c.dist[i] === c.max) best.push(i); return best[rint(best.length)]; }

    // ---- Generator: hill-climb over layouts, scored by exact cluster depth ----
    // Every candidate is a real board reached by shifting/adding/removing cars, and its
    // difficulty is computed exactly by the retrograde BFS above, so the search is steered
    // toward the requested depth instead of hoping a random board happens to be hard.
    function Generator(minD, maxD, seeds) {
        this.minD = minD; this.maxD = maxD;
        // Aim for a random depth inside the tier so puzzles spread across the whole range.
        this.goal = minD + rint(Math.min(maxD, minD + 9) - minD + 1);
        if (minD >= 30) this.goal = minD;           // Grandmaster: any 36+ cluster qualifies
        this.seeds = (seeds || []).filter(function (s) { return s.max >= minD; });
        this.cur = null; this.best = null; this.stall = 0; this.variations = 0; this.varStart = 0; this.discovered = [];
    }
    Generator.prototype.restart = function () {
        var seedChance = this.minD >= 30 ? 1 : this.minD >= 20 ? 0.5 : 0.3, L;
        if (this.seeds.length && Math.random() < seedChance) { var s = this.seeds[rint(this.seeds.length)]; L = { veh: s.veh, pos: s.pos }; }
        else L = randomLayout();
        var c = analyzeCluster(L.veh, L.pos);
        if (!c) return;
        this.cur = { veh: L.veh, c: c }; this.stall = 0; this.variations = 0; this.varStart = 0;
        this.track();
    };
    Generator.prototype.track = function () {
        if (!this.best || this.cur.c.max > this.best.c.max) this.best = this.cur;
        if (this.cur.c.max >= 36 && this.discovered.length < 20) {
            var d = deepestIndex(this.cur.c);
            this.discovered.push({ veh: this.cur.veh, pos: decode(this.cur.veh.length, this.cur.c.keys[d]), max: this.cur.c.max });
        }
    };
    // Works for ~ms milliseconds. Returns a finished puzzle, or null (call again).
    Generator.prototype.step = function (ms) {
        var t0 = Date.now();
        if (!this.started) this.started = t0;
        // Progressive relaxation: after a few seconds, accept any depth already reached inside the tier.
        if (t0 - this.started > 4000 && this.best && this.best.c.max >= this.minD && this.goal > this.best.c.max) {
            this.goal = this.best.c.max; this.cur = this.best;
        } else if (t0 - this.started > 3000 && !this.forcedSeed && this.seeds.length) {
            // Still short of the tier after 3 s: jump to a verified deep seed. Its cluster
            // contains positions at every depth up to its max, so the tier is guaranteed.
            this.forcedSeed = true;
            var s = this.seeds[rint(this.seeds.length)], fc = analyzeCluster(s.veh, s.pos);
            if (fc) { this.cur = { veh: s.veh, c: fc }; this.stall = 0; this.variations = 0; this.varStart = 0; this.track(); }
        }
        while (Date.now() - t0 < ms) {
            if (!this.cur || this.stall > 150) { this.restart(); continue; }
            var c0 = this.cur.c, i = Math.random() < 0.6 ? deepestIndex(c0) : rint(c0.size);
            var m = mutate(this.cur.veh, decode(this.cur.veh.length, c0.keys[i]));
            var c = analyzeCluster(m.veh, m.pos);
            if (c0.max >= this.goal) {
                // Deep enough already (e.g. started from a seed): shift a few more cars while
                // keeping the depth, so each board is a fresh layout rather than a repeat.
                if (!this.varStart) this.varStart = Date.now();
                if (c && c.max >= this.goal) { this.cur = { veh: m.veh, c: c }; this.variations++; this.track(); }
                if (this.variations >= 4 || Date.now() - this.varStart > 1200) return this.finish();
                continue;
            }
            if (!c) { this.stall++; continue; }
            if (c.max >= c0.max) { this.stall = c.max > c0.max ? 0 : this.stall + 1; this.cur = { veh: m.veh, c: c }; this.track(); }
            else this.stall++;
        }
        return null;
    };
    // Choose a start position whose exact optimal solution length is inside the tier.
    Generator.prototype.finish = function (useBest) {
        var L = useBest ? this.best : this.cur, c = L.c;
        var hi = Math.min(c.max, this.maxD), lo = Math.min(this.goal, hi);
        var target = lo + rint(Math.min(hi, lo + 3) - lo + 1), pick = [];
        for (var i = 0; i < c.size; i++) if (c.dist[i] === target) pick.push(i);
        return { veh: L.veh, pos: decode(L.veh.length, c.keys[pick[rint(pick.length)]]), depth: target,
                 inRange: target >= this.minD && target <= this.maxD };
    };
    Generator.prototype.bestDepth = function () { return this.best ? this.best.c.max : 0; };

    return { Generator: Generator, analyzeCluster: analyzeCluster, decode: decode };
})();

<script>
    let CELL_SIZE = 50; // recalculated by fitToScreen()
    const VEHICLE_COLORS = [
        '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6',
        '#ec4899', '#06b6d4', '#84cc16', '#a855f7',
        '#eab308', '#64748b', '#f97316', '#14b8a6',
        '#d946ef', '#0ea5e9'
    ];
    const TIERS = {
        easy:        { min: 2,  max: 5,  label: 'Easy' },
        regular:     { min: 6,  max: 11, label: 'Regular' },
        hard:        { min: 12, max: 20, label: 'Hard' },
        expert:      { min: 21, max: 35, label: 'Expert' },
        grandmaster: { min: 36, max: 60, label: 'Grandmaster' }
    };
    const GEN_BUDGET_MS = 25000;               // hard stop; best board found so far is used
    const BANK_KEY = 'rushHourDeepLayoutBank'; // deep layouts discovered on this device
    let currentVehicles = [];
    let originalVehicles = [];
    let moveCount = 0;
    let minMovesTarget = 0;
    let activeWorker = null;
    let fallbackTimer = null;
    let winExitTimer = null;
    let winOverlayTimer = null;
    const boardEl = document.getElementById('board');
    const gridBg = document.getElementById('gridBg');
    const moveCountEl = document.getElementById('moveCount');
    const minMovesEl = document.getElementById('minMoves');
    const difficultySelect = document.getElementById('difficulty');
    const resetBtn = document.getElementById('resetBtn');
    const generateBtn = document.getElementById('generateBtn');
    const genStatus = document.getElementById('genStatus');
    const winOverlay = document.getElementById('winOverlay');
    const winStats = document.getElementById('winStats');
    const playAgainBtn = document.getElementById('playAgainBtn');
    // ---------- Responsive sizing: board fills the screen width on phones AND tablets ----------
    function fitToScreen() {
        const vv = window.visualViewport;
        const vw = vv ? vv.width : window.innerWidth;
        const vh = vv ? vv.height : window.innerHeight;
        const uiScale = Math.max(1, Math.min(1.4, Math.min(vw, vh) / 520));  // larger text/buttons on iPad
        document.documentElement.style.setProperty('--ui-scale', uiScale.toFixed(3));
        // Width: page padding (20) + card padding + board frame (24) + room for exit arrow
        const byWidth = (vw - 20 - 40 * uiScale - 24) / 6.5;
        // Height: leave room for title, controls and status bar so nothing needs scrolling
        const byHeight = (vh - 44 - 235 * uiScale) / 6;
        const cell = Math.floor(Math.max(40, Math.min(byWidth, byHeight)));
        CELL_SIZE = cell;
        document.documentElement.style.setProperty('--cell', cell + 'px');
        layoutVehicles();
    }
    function layoutVehicles() {
        currentVehicles.forEach(v => {
            const vEl = document.getElementById(`vehicle-${v.id}`);
            if (!vEl) return;
            const exited = v.isTarget && v.x === 4 && winOverlay.classList.contains('active');
            vEl.style.width = `${(v.orientation === 'H' ? v.length * CELL_SIZE : CELL_SIZE) - 4}px`;
            vEl.style.height = `${(v.orientation === 'V' ? v.length * CELL_SIZE : CELL_SIZE) - 4}px`;
            vEl.style.left = `${(exited ? 6 : v.x) * CELL_SIZE + 2}px`;
            vEl.style.top = `${v.y * CELL_SIZE + 2}px`;
        });
    }
    window.addEventListener('resize', fitToScreen);
    window.addEventListener('orientationchange', () => setTimeout(fitToScreen, 250));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitToScreen);

    // Build grid DOM
    for (let i = 0; i < 36; i++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        gridBg.appendChild(cell);
    }
    function getBoardGrid(vehicles) {
        const grid = Array(6).fill(null).map(() => Array(6).fill(-1));
        vehicles.forEach((v, idx) => {
            for (let i = 0; i < v.length; i++) {
                const rx = v.orientation === 'H' ? v.x + i : v.x;
                const ry = v.orientation === 'V' ? v.y + i : v.y;
                if (rx >= 0 && rx < 6 && ry >= 0 && ry < 6) {
                    grid[ry][rx] = idx;
                }
            }
        });
        return grid;
    }

    // ---------- Seed bank (built-in verified deep layouts + ones discovered on this device) ----------
    function parseSeeds(str) {
        return str.split(';').filter(Boolean).map(entry => {
            const [max, body] = entry.split(':');
            const veh = [], pos = [];
            body.split(',').forEach(t => { veh.push({ o: t[0], len: +t[1], fixed: +t[2] }); pos.push(+t[3]); });
            return { max: +max, veh, pos };
        });
    }
    function loadSeedBank() {
        let local = [];
        try { local = JSON.parse(localStorage.getItem(BANK_KEY) || '[]'); } catch (_) {}
        return parseSeeds(RH_BUILTIN_SEEDS).concat(local);
    }
    function saveDiscovered(list) {
        if (!list || !list.length) return;
        try {
            const local = JSON.parse(localStorage.getItem(BANK_KEY) || '[]');
            const sig = s => s.veh.map((v, i) => v.o + v.len + v.fixed + s.pos[i]).join(',');
            const seen = new Set(local.map(sig));
            list.forEach(s => { if (!seen.has(sig(s))) { seen.add(sig(s)); local.push(s); } });
            localStorage.setItem(BANK_KEY, JSON.stringify(local.slice(-60)));
        } catch (_) {}
    }

    // ---------- Generation (Web Worker so the UI never freezes) ----------
    function makeWorker() {
        const src = document.getElementById('rh-engine').textContent + `
            self.onmessage = function (e) {
                var d = e.data, g = new RH.Generator(d.min, d.max, d.seeds), t0 = Date.now(), res = null;
                while (!res) {
                    res = g.step(250);
                    if (!res) {
                        self.postMessage({ type: 'progress', best: g.bestDepth() });
                        if (Date.now() - t0 > d.budget && g.best) res = g.finish(true);
                    }
                }
                self.postMessage({ type: 'done', result: res, discovered: g.discovered });
            };`;
        return new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    }
    function stopGeneration() {
        if (activeWorker) { activeWorker.terminate(); activeWorker = null; }
        if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
    }
    function generatePuzzle() {
        stopGeneration();
        const tier = TIERS[difficultySelect.value];
        const job = { min: tier.min, max: tier.max, seeds: loadSeedBank(), budget: GEN_BUDGET_MS };
        genStatus.innerText = `Building ${tier.label} puzzle...`;
        generateBtn.disabled = true;
        resetBtn.disabled = true;
        const onProgress = best => {
            genStatus.innerText = `Building ${tier.label} puzzle... deepest so far: ${best} moves`;
        };
        let worker = null;
        try { worker = makeWorker(); } catch (_) { worker = null; }
        if (worker) {
            activeWorker = worker;
            worker.onmessage = e => {
                if (e.data.type === 'progress') onProgress(e.data.best);
                else { stopGeneration(); saveDiscovered(e.data.discovered); applyPuzzle(e.data.result, tier); }
            };
            worker.onerror = () => { stopGeneration(); runOnMainThread(job, tier, onProgress); };
            worker.postMessage(job);
        } else {
            runOnMainThread(job, tier, onProgress);
        }
    }
    // Fallback if Workers are blocked: same generator, run in small time slices.
    function runOnMainThread(job, tier, onProgress) {
        const g = new RH.Generator(job.min, job.max, job.seeds), t0 = Date.now();
        const tick = () => {
            let res = g.step(40);
            if (!res && Date.now() - t0 > job.budget && g.best) res = g.finish(true);
            if (res) { fallbackTimer = null; saveDiscovered(g.discovered); applyPuzzle(res, tier); return; }
            onProgress(g.bestDepth());
            fallbackTimer = setTimeout(tick, 0);
        };
        tick();
    }
    function applyPuzzle(res, tier) {
        const palette = VEHICLE_COLORS.slice().sort(() => Math.random() - 0.5);
        currentVehicles = res.veh.map((v, i) => ({
            id: i,
            x: v.o === 'H' ? res.pos[i] : v.fixed,
            y: v.o === 'H' ? v.fixed : res.pos[i],
            length: v.len,
            orientation: v.o,
            isTarget: i === 0,
            color: i === 0 ? '#ef4444' : palette[(i - 1) % palette.length]
        }));
        originalVehicles = currentVehicles.map(v => ({ ...v }));
        minMovesTarget = res.depth;
        moveCount = 0;
        generateBtn.disabled = false;
        resetBtn.disabled = true;
        genStatus.innerText = res.inRange ? '' :
            `Closest found: ${res.depth} moves (below ${tier.label} range). Try New Board.`;
        renderBoard();
    }
    function clearWinTimers() {
        if (winExitTimer !== null) {
            clearTimeout(winExitTimer);
            winExitTimer = null;
        }
        if (winOverlayTimer !== null) {
            clearTimeout(winOverlayTimer);
            winOverlayTimer = null;
        }
    }
    function resetPuzzle() {
        if (!originalVehicles.length || generateBtn.disabled) return;
        clearWinTimers();
        currentVehicles = originalVehicles.map(v => ({ ...v }));
        moveCount = 0;
        resetBtn.disabled = true;
        genStatus.innerText = '';
        renderBoard();
    }
    function renderBoard() {
        clearWinTimers();
        const existingVehicles = boardEl.querySelectorAll('.vehicle');
        existingVehicles.forEach(el => el.remove());
        moveCountEl.innerText = moveCount;
        minMovesEl.innerText = `${minMovesTarget} moves`;
        currentVehicles.forEach(v => {
            const vEl = document.createElement('div');
            vEl.className = `vehicle ${v.isTarget ? 'target' : ''}`;
            vEl.id = `vehicle-${v.id}`;
            vEl.style.backgroundColor = v.color;
            const width = v.orientation === 'H' ? v.length * CELL_SIZE - 4 : CELL_SIZE - 4;
            const height = v.orientation === 'V' ? v.length * CELL_SIZE - 4 : CELL_SIZE - 4;
            vEl.style.width = `${width}px`;
            vEl.style.height = `${height}px`;
            vEl.style.left = `${v.x * CELL_SIZE + 2}px`;
            vEl.style.top = `${v.y * CELL_SIZE + 2}px`;
            if (v.isTarget) {
                vEl.innerHTML = '★ ESCAPE ★';
            }
            attachDragEvents(vEl, v);
            boardEl.appendChild(vEl);
        });
        winOverlay.classList.remove('active');
    }
    function attachDragEvents(el, vehicle) {
        let startX, startY, origX, origY;
        let isDragging = false;

        const onPointerDown = (e) => {
            e.preventDefault();
            isDragging = true;
            el.setPointerCapture(e.pointerId);
            
            startX = e.clientX;
            startY = e.clientY;
            origX = vehicle.x;
            origY = vehicle.y;

            document.querySelectorAll('.vehicle').forEach(v => v.classList.remove('selected'));
            el.classList.add('selected');

            el.addEventListener('pointermove', onPointerMove);
            el.addEventListener('pointerup', onPointerUp);
            el.addEventListener('pointercancel', onPointerUp);
        };

        const onPointerMove = (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            const grid = getBoardGrid(currentVehicles);

            if (vehicle.orientation === 'H') {
                const cellDelta = Math.round(deltaX / CELL_SIZE);
                let targetX = Math.max(0, Math.min(6 - vehicle.length, origX + cellDelta));
                
                let validX = origX;
                const step = targetX > origX ? 1 : -1;
                for (let x = origX + step; step > 0 ? x <= targetX : x >= targetX; x += step) {
                    const leadingEdge = step > 0 ? x + vehicle.length - 1 : x;
                    if (grid[vehicle.y][leadingEdge] !== -1 && grid[vehicle.y][leadingEdge] !== vehicle.id) break;
                    validX = x;
                }

                if (validX !== vehicle.x) {
                    vehicle.x = validX;
                    el.style.left = `${vehicle.x * CELL_SIZE + 2}px`;
                }
            } else {
                const cellDelta = Math.round(deltaY / CELL_SIZE);
                let targetY = Math.max(0, Math.min(6 - vehicle.length, origY + cellDelta));

                let validY = origY;
                const step = targetY > origY ? 1 : -1;
                for (let y = origY + step; step > 0 ? y <= targetY : y >= targetY; y += step) {
                    const leadingEdge = step > 0 ? y + vehicle.length - 1 : y;
                    if (grid[leadingEdge][vehicle.x] !== -1 && grid[leadingEdge][vehicle.x] !== vehicle.id) break;
                    validY = y;
                }

                if (validY !== vehicle.y) {
                    vehicle.y = validY;
                    el.style.top = `${vehicle.y * CELL_SIZE + 2}px`;
                }
            }
        };

        const onPointerUp = (e) => {
            if (!isDragging) return;
            isDragging = false;
            try { el.releasePointerCapture(e.pointerId); } catch(_) {}

            el.removeEventListener('pointermove', onPointerMove);
            el.removeEventListener('pointerup', onPointerUp);
            el.removeEventListener('pointercancel', onPointerUp);

            if (vehicle.x !== origX || vehicle.y !== origY) {
                moveCount++;
                moveCountEl.innerText = moveCount;
                resetBtn.disabled = false;
                checkWinCondition();
            }
        };

        el.addEventListener('pointerdown', onPointerDown);
    }

    function checkWinCondition() {
        const target = currentVehicles[0];
        if (target.x === 4) {
            clearWinTimers();
            winExitTimer = setTimeout(() => {
                winExitTimer = null;
                const targetEl = document.getElementById('vehicle-0');
                if (!targetEl || currentVehicles[0].x !== 4) return;
                targetEl.style.left = `${6 * CELL_SIZE + 2}px`;
                winOverlayTimer = setTimeout(() => {
                    winOverlayTimer = null;
                    if (currentVehicles[0].x !== 4) return;
                    winStats.innerText = `Solved in ${moveCount} moves! (Depth: ${minMovesTarget})`;
                    winOverlay.classList.add('active');
                }, 300);
            }, 100);
        }
    }

    resetBtn.addEventListener('click', resetPuzzle);
    generateBtn.addEventListener('click', generatePuzzle);
    playAgainBtn.addEventListener('click', generatePuzzle);

    fitToScreen();
    generatePuzzle();
</script>
