<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rush Hour Puzzle Game - Expert Edition</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #38bdf8;
            --grid-bg: #1f2937;
            --grid-line: #374151;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid #1f2937;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.75rem;
            color: #f3f4f6;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .objective {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .objective span.red-text {
            color: #ef4444;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        select, button {
            padding: 10px 12px;
            font-size: 0.9rem;
            border-radius: 8px;
            border: 1px solid #374151;
            outline: none;
            cursor: pointer;
        }

        select {
            background-color: #0b0f19;
            color: var(--text-color);
            flex: 1;
        }

        button {
            background-color: #dc2626;
            color: white;
            font-weight: 600;
            border: none;
        }

        .gen-status {
            font-size: 0.85rem;
            color: var(--accent-color);
            height: 20px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .game-wrapper {
            position: relative;
            padding: 8px;
            background-color: #0b0f19;
            border-radius: 16px;
            border: 4px solid #374151;
            touch-action: none;
        }

        .board-container {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: var(--grid-bg);
            border-radius: 8px;
            touch-action: none;
        }

        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            border-radius: 8px;
            overflow: hidden;
        }

        .grid-cell {
            border: 1px solid var(--grid-line);
        }

        .exit-marker {
            position: absolute;
            right: -24px;
            top: 100px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            font-size: 20px;
            font-weight: bold;
        }

        .vehicle {
            position: absolute;
            border-radius: 8px;
            box-sizing: border-box;
            cursor: pointer;
            transition: top 0.1s ease-out, left 0.1s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.3), 0 4px 6px rgba(0,0,0,0.4);
            border: 2px solid rgba(0,0,0,0.2);
            z-index: 10;
            touch-action: none;
        }

        .vehicle.selected {
            outline: 3px solid #ffffff;
            z-index: 20;
        }

        .vehicle.target {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: #991b1b;
        }

        .status-bar {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .win-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .win-overlay h2 {
            font-size: 1.8rem;
            color: #4ade80;
            margin-bottom: 10px;
        }

        .win-overlay p {
            margin-bottom: 20px;
            color: #cbd5e1;
            text-align: center;
            padding: 0 10px;
        }

        .win-overlay button {
            background-color: #22c55e;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RUSH HOUR</h1>
        <p class="objective">Slide vehicles along their axis to free the <span class="red-text">Red Car</span> through the exit!</p>
    </header>

    <div class="controls">
        <select id="difficulty">
            <option value="hard">Hard (12 - 20 moves)</option>
            <option value="expert" selected>Expert (21 - 35 moves)</option>
            <option value="grandmaster">Grandmaster (36+ moves)</option>
        </select>
        <button id="generateBtn">New Board</button>
    </div>

    <div class="gen-status" id="genStatus"></div>

    <div class="game-wrapper">
        <div class="board-container" id="board">
            <div class="grid-background" id="gridBg"></div>
            <div class="exit-marker">➔</div>
        </div>

        <div class="win-overlay" id="winOverlay">
            <h2>Solved!</h2>
            <p id="winStats">You escaped in 0 moves!</p>
            <button id="playAgainBtn">Next Challenge</button>
        </div>
    </div>

    <div class="status-bar">
        <div>Moves: <span id="moveCount" style="color: var(--text-color); font-weight: bold;">0</span></div>
        <div>Minimum: <span id="minMoves" style="color: var(--accent-color); font-weight: bold;">-</span></div>
    </div>
</div>

<script>
    const CELL_SIZE = 50;

    const VEHICLE_COLORS = [
        '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6',
        '#ec4899', '#06b6d4', '#84cc16', '#a855f7',
        '#eab308', '#64748b', '#f97316', '#14b8a6'
    ];

    let currentVehicles = [];
    let moveCount = 0;
    let minMovesTarget = 0;

    const boardEl = document.getElementById('board');
    const gridBg = document.getElementById('gridBg');
    const moveCountEl = document.getElementById('moveCount');
    const minMovesEl = document.getElementById('minMoves');
    const difficultySelect = document.getElementById('difficulty');
    const generateBtn = document.getElementById('generateBtn');
    const genStatus = document.getElementById('genStatus');
    const winOverlay = document.getElementById('winOverlay');
    const winStats = document.getElementById('winStats');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // Build grid DOM
    for (let i = 0; i < 36; i++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        gridBg.appendChild(cell);
    }

    function encodeState(vehicles) {
        // Vehicle identities, lengths and orientations never change, so positions
        // are sufficient to uniquely identify a puzzle state.
        return vehicles.map(v => `${v.x},${v.y}`).join('|');
    }

    function isSolved(vehicles) {
        return vehicles[0].x === 4;
    }

    function getBoardGrid(vehicles) {
        const grid = Array(6).fill(null).map(() => Array(6).fill(-1));
        vehicles.forEach((v, idx) => {
            for (let i = 0; i < v.length; i++) {
                const rx = v.orientation === 'H' ? v.x + i : v.x;
                const ry = v.orientation === 'V' ? v.y + i : v.y;
                if (rx >= 0 && rx < 6 && ry >= 0 && ry < 6) {
                    grid[ry][rx] = idx;
                }
            }
        });
        return grid;
    }

    function getValidMoves(vehicles) {
        const neighbors = [];
        const grid = getBoardGrid(vehicles);

        vehicles.forEach((v, idx) => {
            if (v.orientation === 'H') {
                for (let dist = 1; v.x - dist >= 0; dist++) {
                    if (grid[v.y][v.x - dist] !== -1) break;
                    const nextV = vehicles.map(item => ({...item}));
                    nextV[idx].x -= dist;
                    neighbors.push(nextV);
                }
                for (let dist = 1; v.x + v.length - 1 + dist < 6; dist++) {
                    if (grid[v.y][v.x + v.length - 1 + dist] !== -1) break;
                    const nextV = vehicles.map(item => ({...item}));
                    nextV[idx].x += dist;
                    neighbors.push(nextV);
                }
            } else {
                for (let dist = 1; v.y - dist >= 0; dist++) {
                    if (grid[v.y - dist][v.x] !== -1) break;
                    const nextV = vehicles.map(item => ({...item}));
                    nextV[idx].y -= dist;
                    neighbors.push(nextV);
                }
                for (let dist = 1; v.y + v.length - 1 + dist < 6; dist++) {
                    if (grid[v.y + v.length - 1 + dist][v.x] !== -1) break;
                    const nextV = vehicles.map(item => ({...item}));
                    nextV[idx].y += dist;
                    neighbors.push(nextV);
                }
            }
        });

        return neighbors;
    }

    // Create a random valid vehicle layout with the red car already at the exit.
    // This is the solved endpoint from which we construct a puzzle by reversing moves.
    function createRandomSolvedLayout() {
        const vehicles = [
            { id: 0, x: 4, y: 2, length: 2, orientation: 'H', isTarget: true, color: '#ef4444' }
        ];

        const numObstacles = Math.floor(Math.random() * 3) + 8; // 8-10
        let colorIdx = 0;
        let placementAttempts = 0;

        while (vehicles.length < numObstacles + 1 && placementAttempts < 5000) {
            placementAttempts++;

            const length = Math.random() < 0.30 ? 3 : 2;
            const orientation = Math.random() < 0.5 ? 'H' : 'V';

            const maxX = orientation === 'H' ? 6 - length : 5;
            const maxY = orientation === 'V' ? 6 - length : 5;
            const x = Math.floor(Math.random() * (maxX + 1));
            const y = Math.floor(Math.random() * (maxY + 1));

            const grid = getBoardGrid(vehicles);
            let overlap = false;

            for (let i = 0; i < length; i++) {
                const cx = orientation === 'H' ? x + i : x;
                const cy = orientation === 'V' ? y + i : y;

                // The initial solved position must leave cells 0-3 of the
                // red-car row empty. That makes the reverse move x=4 -> x=0
                // legal, rather than teleporting the red car through obstacles.
                if (cy === 2 && cx <= 3) {
                    overlap = true;
                    break;
                }

                if (grid[cy][cx] !== -1) {
                    overlap = true;
                    break;
                }
            }

            if (!overlap) {
                vehicles.push({
                    id: vehicles.length,
                    x,
                    y,
                    length,
                    orientation,
                    isTarget: false,
                    color: VEHICLE_COLORS[colorIdx % VEHICLE_COLORS.length]
                });
                colorIdx++;
            }
        }

        return vehicles.length === numObstacles + 1 ? vehicles : null;
    }

    // Pick one legal reverse move. The red car is deliberately excluded after
    // its initial reverse move so the scramble cannot undo most of its own difficulty.
    function getRandomReverseMove(vehicles, previousKey, allowTarget) {
        const moves = [];
        const grid = getBoardGrid(vehicles);

        vehicles.forEach((v, idx) => {
            if (v.isTarget && !allowTarget) return;

            if (v.orientation === 'H') {
                for (let dist = 1; v.x - dist >= 0; dist++) {
                    if (grid[v.y][v.x - dist] !== -1) break;
                    const nextState = vehicles.map(item => ({...item}));
                    nextState[idx].x -= dist;
                    const key = encodeState(nextState);
                    if (key !== previousKey) moves.push(nextState);
                }

                for (let dist = 1; v.x + v.length - 1 + dist < 6; dist++) {
                    if (grid[v.y][v.x + v.length - 1 + dist] !== -1) break;
                    const nextState = vehicles.map(item => ({...item}));
                    nextState[idx].x += dist;
                    const key = encodeState(nextState);
                    if (key !== previousKey) moves.push(nextState);
                }
            } else {
                for (let dist = 1; v.y - dist >= 0; dist++) {
                    if (grid[v.y - dist][v.x] !== -1) break;
                    const nextState = vehicles.map(item => ({...item}));
                    nextState[idx].y -= dist;
                    const key = encodeState(nextState);
                    if (key !== previousKey) moves.push(nextState);
                }

                for (let dist = 1; v.y + v.length - 1 + dist < 6; dist++) {
                    if (grid[v.y + v.length - 1 + dist][v.x] !== -1) break;
                    const nextState = vehicles.map(item => ({...item}));
                    nextState[idx].y += dist;
                    const key = encodeState(nextState);
                    if (key !== previousKey) moves.push(nextState);
                }
            }
        });

        return moves.length ? moves[Math.floor(Math.random() * moves.length)] : null;
    }

    // Exact shortest-path solver used only AFTER a board has been constructed.
    // It verifies the actual puzzle difficulty without driving generation.
    function solvePuzzle(initialVehicles, maxIterations = 75000) {
        if (isSolved(initialVehicles)) return 0;

        const queue = [{ state: initialVehicles, dist: 0 }];
        let head = 0;
        const visited = new Set([encodeState(initialVehicles)]);
        let iterations = 0;

        while (head < queue.length && iterations < maxIterations) {
            const { state, dist } = queue[head++];
            iterations++;

            const neighbors = getValidMoves(state);
            for (const nextState of neighbors) {
                const nextDist = dist + 1;
                if (isSolved(nextState)) return nextDist;

                const key = encodeState(nextState);
                if (!visited.has(key)) {
                    visited.add(key);
                    queue.push({ state: nextState, dist: nextDist });
                }
            }
        }

        return -1;
    }

    function generatePuzzle() {
        genStatus.innerText = "Building a new puzzle...";

        setTimeout(() => {
            const diff = difficultySelect.value;
            let minTarget = 12, maxTarget = 20;
            let scrambleMin = 30, scrambleMax = 45;
            if (diff === 'expert') { minTarget = 21; maxTarget = 35; scrambleMin = 45; scrambleMax = 65; }
            if (diff === 'grandmaster') { minTarget = 36; maxTarget = 60; scrambleMin = 70; scrambleMax = 100; }

            let bestBoard = null;
            let bestScore = Infinity;

            // Construct many boards from solved endpoints, but only solve the
            // constructed candidates. We never solve arbitrary random layouts.
            for (let attempt = 0; attempt < 10; attempt++) {
                let vehicles = createRandomSolvedLayout();
                if (!vehicles) continue;

                // Mandatory first reverse move: put the red car at the far left.
                // This makes a one-move puzzle impossible by construction, and from
                // here onward the red car never moves during the backward scramble.
                vehicles[0].x = 0;

                // Continue scrambling only the obstacle vehicles. Use a much deeper
                // construction path than the requested minimum because random walks
                // can contain moves that are unnecessary in the final shortest path.
                let previousKey = encodeState(vehicles);
                const visitedDuringScramble = new Set([previousKey]);
                const targetDepth = scrambleMin + Math.floor(Math.random() * (scrambleMax - scrambleMin + 1));
                let scrambleDepth = 1;

                while (scrambleDepth < targetDepth) {
                    let options = [];
                    const grid = getBoardGrid(vehicles);

                    vehicles.forEach((v, idx) => {
                        if (idx === 0) return;

                        if (v.orientation === 'H') {
                            for (let dist = 1; v.x - dist >= 0; dist++) {
                                if (grid[v.y][v.x - dist] !== -1) break;
                                const nextState = vehicles.map(item => ({...item}));
                                nextState[idx].x -= dist;
                                const key = encodeState(nextState);
                                if (key !== previousKey && !visitedDuringScramble.has(key)) options.push({ nextState, key });
                            }
                            for (let dist = 1; v.x + v.length - 1 + dist < 6; dist++) {
                                if (grid[v.y][v.x + v.length - 1 + dist] !== -1) break;
                                const nextState = vehicles.map(item => ({...item}));
                                nextState[idx].x += dist;
                                const key = encodeState(nextState);
                                if (key !== previousKey && !visitedDuringScramble.has(key)) options.push({ nextState, key });
                            }
                        } else {
                            for (let dist = 1; v.y - dist >= 0; dist++) {
                                if (grid[v.y - dist][v.x] !== -1) break;
                                const nextState = vehicles.map(item => ({...item}));
                                nextState[idx].y -= dist;
                                const key = encodeState(nextState);
                                if (key !== previousKey && !visitedDuringScramble.has(key)) options.push({ nextState, key });
                            }
                            for (let dist = 1; v.y + v.length - 1 + dist < 6; dist++) {
                                if (grid[v.y + v.length - 1 + dist][v.x] !== -1) break;
                                const nextState = vehicles.map(item => ({...item}));
                                nextState[idx].y += dist;
                                const key = encodeState(nextState);
                                if (key !== previousKey && !visitedDuringScramble.has(key)) options.push({ nextState, key });
                            }
                        }
                    });

                    if (!options.length) break;
                    const chosen = options[Math.floor(Math.random() * options.length)];
                    previousKey = chosen.key;
                    visitedDuringScramble.add(chosen.key);
                    vehicles = chosen.nextState;
                    scrambleDepth++;
                }

                // The red car starts at x=0. Require at least one vehicle to block
                // the exit lane, otherwise the puzzle could still be solved in one move.
                const finalGrid = getBoardGrid(vehicles);
                const hasExitBlocker = finalGrid[2][2] !== -1 || finalGrid[2][3] !== -1;
                if (!hasExitBlocker) continue;

                // Verify the actual shortest solution length. This is the quantity
                // shown to the player, not the arbitrary scramble depth.
                const actualDepth = solvePuzzle(vehicles);
                if (actualDepth >= minTarget && actualDepth <= maxTarget) {
                    bestBoard = vehicles;
                    bestScore = actualDepth;
                    break;
                }

                // Keep the closest valid candidate as a safety fallback.
                const distance = actualDepth < 0
                    ? 1000
                    : actualDepth < minTarget
                        ? minTarget - actualDepth
                        : actualDepth > maxTarget
                            ? actualDepth - maxTarget
                            : 0;
                if (distance < bestScore) {
                    bestScore = distance;
                    bestBoard = vehicles;
                    bestBoard._actualDepth = actualDepth;
                }
            }

            // Final fallback: keep constructing until we have a solvable board.
            if (!bestBoard) {
                bestBoard = createRandomSolvedLayout();
                minTarget = 0;
                bestScore = 0;
            }

            const verifiedDepth = typeof bestBoard._actualDepth === 'number'
                ? bestBoard._actualDepth
                : solvePuzzle(bestBoard);
            delete bestBoard._actualDepth;

            currentVehicles = bestBoard;
            minMovesTarget = verifiedDepth > 0 ? verifiedDepth : 0;
            moveCount = 0;
            genStatus.innerText = verifiedDepth >= minTarget && verifiedDepth <= maxTarget
                ? ""
                : "Generated a solvable board; generating a deeper one next time.";
            renderBoard();
        }, 20);
    }

    function renderBoard() {
        const existingVehicles = boardEl.querySelectorAll('.vehicle');
        existingVehicles.forEach(el => el.remove());

        moveCountEl.innerText = moveCount;
        minMovesEl.innerText = `${minMovesTarget} moves`;

        currentVehicles.forEach(v => {
            const vEl = document.createElement('div');
            vEl.className = `vehicle ${v.isTarget ? 'target' : ''}`;
            vEl.id = `vehicle-${v.id}`;
            vEl.style.backgroundColor = v.color;

            const width = v.orientation === 'H' ? v.length * CELL_SIZE - 4 : CELL_SIZE - 4;
            const height = v.orientation === 'V' ? v.length * CELL_SIZE - 4 : CELL_SIZE - 4;

            vEl.style.width = `${width}px`;
            vEl.style.height = `${height}px`;
            vEl.style.left = `${v.x * CELL_SIZE + 2}px`;
            vEl.style.top = `${v.y * CELL_SIZE + 2}px`;

            if (v.isTarget) {
                vEl.innerHTML = '★ ESCAPE ★';
            }

            attachDragEvents(vEl, v);
            boardEl.appendChild(vEl);
        });

        winOverlay.classList.remove('active');
    }

    function attachDragEvents(el, vehicle) {
        let startX, startY, origX, origY;
        let isDragging = false;

        const onPointerDown = (e) => {
            e.preventDefault();
            isDragging = true;
            el.setPointerCapture(e.pointerId);
            
            startX = e.clientX;
            startY = e.clientY;
            origX = vehicle.x;
            origY = vehicle.y;

            document.querySelectorAll('.vehicle').forEach(v => v.classList.remove('selected'));
            el.classList.add('selected');

            el.addEventListener('pointermove', onPointerMove);
            el.addEventListener('pointerup', onPointerUp);
            el.addEventListener('pointercancel', onPointerUp);
        };

        const onPointerMove = (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            const grid = getBoardGrid(currentVehicles);

            if (vehicle.orientation === 'H') {
                const cellDelta = Math.round(deltaX / CELL_SIZE);
                let targetX = Math.max(0, Math.min(6 - vehicle.length, origX + cellDelta));
                
                let validX = origX;
                const step = targetX > origX ? 1 : -1;
                for (let x = origX + step; step > 0 ? x <= targetX : x >= targetX; x += step) {
                    const leadingEdge = step > 0 ? x + vehicle.length - 1 : x;
                    if (grid[vehicle.y][leadingEdge] !== -1 && grid[vehicle.y][leadingEdge] !== vehicle.id) break;
                    validX = x;
                }

                if (validX !== vehicle.x) {
                    vehicle.x = validX;
                    el.style.left = `${vehicle.x * CELL_SIZE + 2}px`;
                }
            } else {
                const cellDelta = Math.round(deltaY / CELL_SIZE);
                let targetY = Math.max(0, Math.min(6 - vehicle.length, origY + cellDelta));

                let validY = origY;
                const step = targetY > origY ? 1 : -1;
                for (let y = origY + step; step > 0 ? y <= targetY : y >= targetY; y += step) {
                    const leadingEdge = step > 0 ? y + vehicle.length - 1 : y;
                    if (grid[leadingEdge][vehicle.x] !== -1 && grid[leadingEdge][vehicle.x] !== vehicle.id) break;
                    validY = y;
                }

                if (validY !== vehicle.y) {
                    vehicle.y = validY;
                    el.style.top = `${vehicle.y * CELL_SIZE + 2}px`;
                }
            }
        };

        const onPointerUp = (e) => {
            if (!isDragging) return;
            isDragging = false;
            try { el.releasePointerCapture(e.pointerId); } catch(_) {}

            el.removeEventListener('pointermove', onPointerMove);
            el.removeEventListener('pointerup', onPointerUp);
            el.removeEventListener('pointercancel', onPointerUp);

            if (vehicle.x !== origX || vehicle.y !== origY) {
                moveCount++;
                moveCountEl.innerText = moveCount;
                checkWinCondition();
            }
        };

        el.addEventListener('pointerdown', onPointerDown);
    }

    function checkWinCondition() {
        const target = currentVehicles[0];
        if (target.x === 4) {
            setTimeout(() => {
                const targetEl = document.getElementById('vehicle-0');
                targetEl.style.left = `${6 * CELL_SIZE + 2}px`;
                
                setTimeout(() => {
                    winStats.innerText = `Solved in ${moveCount} moves! (Depth: ${minMovesTarget})`;
                    winOverlay.classList.add('active');
                }, 300);
            }, 100);
        }
    }

    generateBtn.addEventListener('click', generatePuzzle);
    playAgainBtn.addEventListener('click', generatePuzzle);

    generatePuzzle();
</script>
